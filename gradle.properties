org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 高德开放平台申请的 Android 定位 SDK key（绑定包名 com.ruyue.alarm + 签名 SHA1）
# 建议写在 local.properties 里（该文件不进版本库）：
#     AMAP_KEY=你申请到的32位key
# 这里的 AMAP_KEY 仅作回退；留空时「高德围栏验证」页只显示接入说明，不会崩溃。
# 填好 key 后把 app/build.gradle 里 amap 依赖的注释打开即可启用。
AMAP_KEY=
